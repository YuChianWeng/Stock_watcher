name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 只出現在 mocks/ 的字串（minify 後仍保留）；改 mock 資料時一併更新
  MOCK_MARKERS: "示範半導體|BMockVapidPublicKey|虛構重工"

jobs:
  check:
    name: Typecheck · Test · Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build (production, no mock)
        run: npm run build

      - name: Production bundle must not include mock data
        run: |
          if grep -rlE "$MOCK_MARKERS" dist; then
            echo "::error::mock code found in production build (dist/)"; exit 1
          fi

      - name: Build (single-file preview with mock)
        run: npm run build:preview

      - name: Control — preview build must include the mock markers
        run: |
          if ! grep -rlE "$MOCK_MARKERS" dist-preview >/dev/null; then
            echo "::error::mock markers not found in dist-preview/; update MOCK_MARKERS so the production check above is not empty"; exit 1
          fi

      - uses: actions/upload-artifact@v5
        with:
          name: stocks-dist
          path: |
            dist/
            dist-preview/stocks-preview.html
          retention-days: 14
